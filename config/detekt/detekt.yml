# detekt config for the project's custom ruleset.
#
# detekt's built-in rule sets are turned off in build.gradle.kts
# (disableDefaultRuleSets = true) — this file only configures the custom
# `sodogku` rules from :detekt-rules. Adding a rule = a new entry here plus
# a constructor reference in SodogkuRuleSetProvider.
sodogku:
  active: true
  VerifyStrings:
    active: true
    # Two dev-only surfaces, both English-only and neither shipped to a player.
    #
    # The config admin tool (:apps:admin) is a local-only utility with no
    # :libraries:resources dependency — the i18n rule doesn't apply, and its
    # `Text(...)` is Compose HTML's, not the DS composable anyway.
    #
    # The QA menu renders only in debug builds, reached from Settings or the
    # shake dialog. Putting "Seed 6 days" in strings.xml would hand a translator
    # developer tooling and put it in the shipped resource table. `ShakeDialog`
    # already hardcodes its own debug-only button label for the same reason.
    excludes: ['**/apps/admin/**', '**/com/sodogku/qa/**']
  AnimatedStateReadInComposition:
    active: true
  NoRawDesignValues:
    active: true
    # The design system itself has to define the tokens and wrap the Material
    # primitives somewhere, and that somewhere is :libraries:ui. The admin
    # console is a local-only dev tool on Compose HTML, not the DS.
    excludes: ['**/libraries/ui/**', '**/apps/admin/**']
    # Material types the DS legitimately re-exports rather than wraps: shapes
    # and window insets are layout primitives with no themed equivalent.
    allowedMaterialImports:
      - 'androidx.compose.material3.Surface'
      - 'androidx.compose.material3.MaterialTheme'
      - 'androidx.compose.material3.ExperimentalMaterial3Api'
  ScrollInsideBottomSheet:
    active: true
